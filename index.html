<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公演管理ツール</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { font-size: 1.2rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <h1>公演スケジュール・チケット管理</h1>

  <div class="form-group">
    <label for="group-select">グループ名</label>
    <select id="group-select">
      <option value="ハロプロ">ハロプロ（全体・ハロコン）</option>
      <option value="OCHA NORMA">OCHA NORMA</option>
      <option value="BEYOOOOONDS">BEYOOOOONDS</option>
      <option value="ハロプロ研修生">ハロプロ研修生</option>
      <option value="その他">その他</option>
    </select>
  </div>

  <div class="form-group">
    <label for="event-title">公演名・ツアータイトル</label>
    <input type="text" id="event-title" placeholder="例: 夏のハロコン / 単独ツアー">
  </div>

  <div class="form-group">
    <label for="event-date">開催日時</label>
    <input type="datetime-local" id="event-date">
  </div>

  <div class="form-group">
    <label for="venue">会場</label>
    <input type="text" id="venue" placeholder="例: 中野サンプラザ / 立川ステージガーデン">
  </div>

  <div class="form-group">
    <label for="seat-info">座席情報（開演前に入力）</label>
    <input type="text" id="seat-info" placeholder="例: 1階 12列 25番">
  </div>

  <div class="form-group">
    <label for="memo">メモ</label>
    <textarea id="memo" rows="3" placeholder="発券番号や当日の持ち物など"></textarea>
  </div>

  <button type="button" onclick="alert('保存機能はFirebaseの設定後に動きます！')">保存する</button>

</body>
</html>
