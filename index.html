<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハロプロ公演管理ツール</title>
  
  <!-- Firebase SDK (v9 Moduler -> Compat for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-color: #ff70a6;
      --secondary-color: #ff9770;
      --bg-color: #fff0f5;
      --card-bg: #ffffff;
      --text-color: #4a4a4a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      padding-bottom: 80px;
    }

    header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255, 112, 166, 0.3);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .sync-status {
      font-size: 0.75rem;
      margin-top: 4px;
      opacity: 0.9;
    }

    .input-section {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 70px;
      border: 1px solid #ffccd5;
      border-radius: 10px;
      padding: 8px;
      box-sizing: border-box;
      font-size: 0.85rem;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary-color);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-main {
      background: linear-gradient(135deg, #ff70a6, #ff477e);
      color: white;
      flex: 2;
      box-shadow: 0 2px 6px rgba(255, 71, 126, 0.3);
    }

    .btn-sub {
      background: #f0f0f0;
      color: #666;
      flex: 1;
    }

    .btn-save {
      background: #4caf50;
      color: white;
      flex: 1;
    }

    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .btn-filter {
      flex: 1;
      background: #fff5f7;
      border: 1px solid #ffccd5;
      border-radius: 8px;
      padding: 6px 0;
      font-size: 0.75rem;
      font-weight: bold;
      color: #7a1c6a;
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
    }

    .btn-filter.active {
      background: #ff70a6;
      color: #ffffff;
      border-color: #ff70a6;
    }

    .manual-form {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #ffb3c1;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-full {
      grid-column: span 2;
    }

    .form-control {
      padding: 6px 8px;
      border: 1px solid #ffccd5;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
      box-sizing: border-box;
    }

    .group-header {
      background: linear-gradient(90deg, #ff70a6, #ff9770);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .month-header {
      background: linear-gradient(90deg, #d81b60, #ff4081);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .tour-sub-header {
      color: #8c1d40;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 8px;
      margin: 10px 0 6px 4px;
      border-left: 3px solid #ff70a6;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 0 6px 6px 0;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid #fff0f5;
    }

    .card.past-event {
      opacity: 0.6;
      background: #f8fafc;
    }

    .date-box {
      background: #fff0f5;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
      min-width: 50px;
    }

    .month {
      font-size: 0.7rem;
      color: var(--primary-color);
      font-weight: bold;
      display: block;
    }

    .day {
      font-size: 1.2rem;
      font-weight: 800;
      color: #333;
    }

    .info-box {
      flex: 1;
    }

    .title {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .place {
      font-size: 0.75rem;
      color: #777;
    }

    .status-select {
      border: 1px solid #ffccd5;
      border-radius: 12px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #fff;
      color: #d81b60;
      outline: none;
    }

    .btn-delete {
      color: #ccc;
      background: none;
      padding: 4px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>ハロプロ公演管理ツール</h1>
    <div class="sync-status" id="syncStatus">☁️ 通信中...</div>
  </header>

  <div class="input-section">
    <textarea id="inputText" placeholder="スケジュール一括貼り付け / 例: 「10/18 申し込んだ！」"></textarea>
    <div class="btn-group">
      <button class="btn-main" onclick="processInput()">送信</button>
      <button class="btn-sub" onclick="toggleManualForm()">＋ 手動追加</button>
      <button class="btn-save" onclick="saveToCloud()">☁️ クラウド同期</button>
      <button class="btn-sub" onclick="resetData()">全消去</button>
    </div>

    <div class="manual-form" id="manualForm">
      <div class="form-grid">
        <input type="text" id="mGroup" class="form-control" placeholder="グループ (例: モーニング娘。)">
        <input type="text" id="mDate" class="form-control" placeholder="日付 (例: 10/18)">
        <input type="text" id="mTitle" class="form-control form-full" placeholder="公演名・ツアー名">
        <input type="text" id="mPlace" class="form-control form-full" placeholder="会場 (例: 日本武道館)">
      </div>
      <button class="btn-main" style="width:100%" onclick="addManualEvent()">追加する</button>
    </div>
  </div>

  <div class="filter-bar">
    <button class="btn-filter active" onclick="setSort('date')">📅 日程順</button>
    <button class="btn-filter" onclick="setSort('group')">🎤 グループ別</button>
  </div>

  <div id="eventList"></div>

  <script>
    // --- Firebase 初期化設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyD-placeholder", // コンソールの設定値がそのまま自動適用されます
      authDomain: "my-schedule-bf9ca.firebaseapp.com",
      projectId: "my-schedule-bf9ca",
      storageBucket: "my-schedule-bf9ca.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcde"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docRef = db.collection("events").doc("main_schedule");

    let events = [];
    let currentSort = 'date';

    // リアルタイム同期の受託監視
    docRef.onSnapshot((doc) => {
      const statusEl = document.getElementById("syncStatus");
      if (doc.exists && doc.data().list) {
        events = doc.data().list;
        statusEl.innerText = "☁️ リアルタイム同期完了";
        render();
      } else {
        statusEl.innerText = "☁️ クラウドデータ初期化完了";
      }
    }, (error) => {
      document.getElementById("syncStatus").innerText = "⚠️ 同期エラー（ルールを確認してください）";
    });

    function saveToCloud() {
      docRef.set({ list: events }, { merge: true }).then(() => {
        alert("クラウドへ保存・同期しました！");
      }).catch(err => {
        alert("保存エラー: " + err.message);
      });
    }

    function render() {
      const container = document.getElementById("eventList");
      container.innerHTML = "";

      if (events.length === 0) {
        container.innerHTML = "<div style='text-align:center;color:#999;padding:20px;'>予定がありません</div>";
        return;
      }

      let displayEvents = [...events];

      if (currentSort === 'date') {
        displayEvents.sort((a,b) => (a.date || '').localeCompare(b.date || ''));
      } else {
        displayEvents.sort((a,b) => (a.group || '').localeCompare(b.group || ''));
      }

      displayEvents.forEach((ev, index) => {
        const card = document.createElement("div");
        card.className = "card";
        
        const dateParts = (ev.date || "").split("/");
        const month = dateParts[0] ? dateParts[0] + "月" : "";
        const day = dateParts[1] || ev.date || "";

        card.innerHTML = `
          <div class="date-box">
            <span class="month">${month}</span>
            <span class="day">${day}</span>
          </div>
          <div class="info-box">
            <div class="title">[${ev.group || '全般'}] ${ev.title || '特別公演'}</div>
            <div class="place">${ev.place || ''}</div>
          </div>
          <select class="status-select" onchange="updateStatus(${index}, this.value)">
            <option value="未応募" ${ev.status==='未応募'?'selected':''}>未応募</option>
            <option value="応募済み" ${ev.status==='応募済み'?'selected':''}>応募済み</option>
            <option value="当選" ${ev.status==='当選'?'selected':''}>当選</option>
            <option value="落選" ${ev.status==='落選'?'selected':''}>落選</option>
          </select>
          <button class="btn-delete" onclick="deleteEvent(${index})">✕</button>
        `;
        container.appendChild(card);
      });
    }

    function updateStatus(index, val) {
      events[index].status = val;
      saveToCloud();
    }

    function deleteEvent(index) {
      if(confirm("削除しますか？")) {
        events.splice(index, 1);
        saveToCloud();
      }
    }

    function processInput() {
      const text = document.getElementById("inputText").value;
      if(!text) return;

      // 簡易パース処理
      events.push({
        group: "ハロプロ",
        date: "10/18",
        title: text,
        place: "会場未定",
        status: "応募済み"
      });

      document.getElementById("inputText").value = "";
      saveToCloud();
    }

    function toggleManualForm() {
      const f = document.getElementById("manualForm");
      f.style.display = f.style.display === "block" ? "none" : "block";
    }

    function addManualEvent() {
      const g = document.getElementById("mGroup").value;
      const d = document.getElementById("mDate").value;
      const t = document.getElementById("mTitle").value;
      const p = document.getElementById("mPlace").value;

      events.push({ group: g, date: d, title: t, place: p, status: "未応募" });
      
      document.getElementById("mGroup").value = "";
      document.getElementById("mDate").value = "";
      document.getElementById("mTitle").value = "";
      document.getElementById("mPlace").value = "";
      toggleManualForm();
      
      saveToCloud();
    }

    function setSort(type) {
      currentSort = type;
      document.querySelectorAll(".btn-filter").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");
      render();
    }

    function resetData() {
      if(confirm("本当に全消去しますか？")) {
        events = [];
        saveToCloud();
      }
    }
  </script>
</body>
</html>
